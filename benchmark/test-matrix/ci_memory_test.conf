# CI smoke test — memory benchmark.
#
# Runs a few memory_benchmark binaries so the post-processing memory/RAM
# scalability parsers have a memory_test/ directory to consume. fastrtps only
# (no zenoh router to manage in CI). These binaries create their nodes, sample
# RSS, and exit — no timed spin — so they are cheap.

OUTPUT_DIR_NAME="memory_test"
MEMORY_TOPOLOGIES=(default_nodes pub_sub_same_topic cli_serv_same_topics)

RMW_LIST=("fastrtps")
