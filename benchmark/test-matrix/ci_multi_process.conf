# CI smoke test — multi-process pub/sub.
#
# Companion to ci_single_process.conf. Produces the matching multi-process /
# pub-sub / 10b / fastrtps_ipc_off entry so compare_processes.py has both a
# single- and multi-process input to compare. Keep it fast: one RMW, the
# smallest payload, short duration (ROS2_BENCHMARK_TEST_DURATION=1 in CI).
#
# The multi-process runner always uses --ipc off, so only ipc_off is listed.

OUTPUT_DIR_NAME="pub-sub_multi_process"

TOPOLOGIES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../topologies/pub-sub"
PROFILES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../profiles"

# Paired topologies: one publisher process, one subscriber process.
RESULTS=("10b")
TOPOLOGY1=("pub_200hz_10b")
TOPOLOGY2=("sub_10b")

RMW_LIST=("fastrtps")

COMMS_fastrtps=("ipc_off")
