# CI smoke test — single-process pub/sub.
#
# Minimal matrix meant to exercise the runner + post-processing pipeline in CI,
# NOT to produce meaningful measurements.

# Produces the matching single-process / pub-sub / 10b / fastrtps_ipc_off entry 
# so compare_processes.py has both a single- and multi-process input to compare.
# Deliberately kept fast and small.

OUTPUT_DIR_NAME="pub-sub_single_process"
TOPOLOGIES=("pub_sub_200hz_10b" "pub_sub_200hz_100kb")

TOPOLOGIES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../topologies/pub-sub"
PROFILES_DIR="${ROS2_BENCHMARK_SCRIPTS_DIR}/../profiles"

# fastrtps + zenoh in CI. zenoh exercises the router auto-spawn path in
# run_zenoh_router.sh, so a broken router config path fails CI (the runner
# aborts when no zenohd process comes up). rmw-zenoh-cpp ships in the base image.
RMW_LIST=("fastrtps" "zenoh")

COMMS_fastrtps=("ipc_on" "ipc_off")
COMMS_zenoh=("ipc_on" "ipc_off")
